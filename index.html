<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FlipQuiz - Quiz Collaborativo in Classe</title>
    <meta name="description" content="Piattaforma didattica stile PanQuiz: gli studenti creano le domande, il docente proietta e avvia la sfida live con 13 tipologie di gioco interattive, punteggi e 3 diti più veloci." />
    <meta property="og:title" content="FlipQuiz - Quiz Collaborativo in Classe" />
    <meta property="og:description" content="Piattaforma didattica stile PanQuiz: gli studenti creano le domande, il docente proietta e avvia la sfida live con 13 tipologie di gioco interattive, punteggi e 3 diti più veloci." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?w=1200&h=630&fit=crop&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlipQuiz - Quiz Collaborativo in Classe" />
    <meta name="twitter:description" content="Gli studenti creano le domande da banco, il docente avvia la sfida live sulla LIM con classifica in tempo reale." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?w=1200&h=630&fit=crop&q=80" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;
        var pathname = window.location.pathname;
        var isDocs = pathname.indexOf('/docs') !== -1;

        // Se su GitHub Pages viene aperto il sorgente non compilato dalla radice, reindirizza alla cartella compilata /docs/
        if (isGitHubPages && !isDocs) {
          var target = pathname;
          if (!target.endsWith('/')) target += '/';
          target += 'docs/' + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }

        // Assicura il trailing slash per GitHub Pages (es. /FlipQuiz/ invece di /FlipQuiz)
        if (pathname.length > 1 && !pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
          window.location.replace(pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="loading-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          ⚡
        </div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff;">FlipQuiz</h1>
        <p id="loading-text" style="font-size: 14px; color: #94a3b8; margin: 0 0 24px 0;">Caricamento della piattaforma didattica...</p>
        <div id="loading-spinner" style="width: 36px; height: 36px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: fq-spin 0.8s linear infinite;"></div>
        
        <div id="diagnostic-box" style="display: none; margin-top: 24px; max-width: 500px; background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 16px; padding: 20px; text-align: left; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <div style="font-weight: 700; color: #f59e0b; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
            <span>⚠️</span> Avvio su GitHub Pages
          </div>
          <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5; margin: 0 0 14px 0;">
            Se la schermata rimane in caricamento, apri direttamente la versione compilata pronta all'uso oppure imposta GitHub Actions:
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <a id="btn-goto-docs" href="./docs/" style="display: inline-block; text-align: center; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #ffffff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 10px 16px; border-radius: 10px;">
              🚀 Apri Versione Compilata (/docs/)
            </a>
            <button onclick="window.location.reload()" style="background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); font-weight: 600; font-size: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer;">
              🔄 Ricarica Pagina
            </button>
          </div>
        </div>

        <script>
          // Se dopo 3.5 secondi React non è ancora montato, mostra il riquadro diagnostico
          setTimeout(function() {
            if (!window.__FLIPQUIZ_MOUNTED__) {
              var diag = document.getElementById('diagnostic-box');
              if (diag) diag.style.display = 'block';
            }
          }, 3500);
        </script>

        <style>
          @keyframes fq-spin { to { transform: rotate(360deg); } }
        </style>
        <noscript>
          <div style="margin-top: 24px; padding: 12px 20px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; color: #fca5a5; font-size: 13px;">
            JavaScript è disabilitato. Abilita JavaScript per eseguire FlipQuiz.
          </div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
